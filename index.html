
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AmoraPets Mobile</title>
    
    <!-- Google Fonts: Playfair Display para elegância -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Lato', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'], /* Fonte elegante para títulos */
            },
            colors: {
              primary: '#A78BFA',     /* Lilás Unissex (Violet-400) */
              'primary-light': '#C4B5FD', /* Lilás Claro (Violet-300) */
              'primary-dark': '#7C3AED',  /* Roxo mais profundo (Violet-600) */
              black: '#121212',
              'dark-grey': '#1E1E1E',
              accent: '#38BDF8',      /* Azul Celeste para complementar o Lilás */
              'accent-light': '#BAE6FD',
              whatsapp: '#25D366',
              success: '#4ADE80',     /* Verde Vibrante */
              warning: '#FBBF24',     /* Amarelo Solar */
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'bounce-slight': 'bounceSlight 2s infinite'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              bounceSlight: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            }
          }
        }
      }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { background-color: #121212; margin: 0; -webkit-tap-highlight-color: transparent; font-family: 'Lato', sans-serif; color: white; }
      h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #121212; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      input, select, button, textarea { font-size: 16px !important; outline: none; } 
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- Script principal será injetado aqui pelo index.tsx -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
